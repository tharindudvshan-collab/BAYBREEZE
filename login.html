<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · BAYBREEZE Business OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090A11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="wrap">
 <div class="card">
  <div class="brand"><div class="ring">B</div><div><b>BAYBREEZE</b><small>Jaadi Business OS</small></div></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to open your dashboard.</p>
  <form id="loginForm" autocomplete="on">
   <label>Username<input type="text" id="user" placeholder="owner" autocomplete="username" required></label>
   <label>Password<input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required></label>
   <div id="err" class="err" hidden>Incorrect username or password.</div>
   <button type="submit" class="cta">Sign in</button>
  </form>
  <p class="hint">Demo credentials: <b>owner</b> / <b>1234</b></p>
 </div>
</div>
<script src="login.js" defer></script>
</body>
</html>
