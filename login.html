<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · BAYBREEZE Business OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090A11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
 <div class="card">
  <div class="brand"><div class="ring">B</div><div><b>BAYBREEZE</b><small>Jaadi Business OS</small></div></div>
  <h1 id="formTitle">Welcome back</h1>
  <p class="sub" id="formSub">Sign in to open your dashboard.</p>
  <form id="loginForm" autocomplete="on">
   <label>Email<input type="email" id="user" placeholder="owner@yourbusiness.lk" autocomplete="username" required></label>
   <label>Password<input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required minlength="6"></label>
   <div id="err" class="err" hidden></div>
   <div id="ok" class="ok" hidden></div>
   <button type="submit" class="cta" id="submitBtn">Sign in</button>
  </form>
  <p class="hint">First time here? <button type="button" id="toggleMode" class="link">Create the owner account</button></p>
 </div>
</div>
<script src="login.js" defer></script>
</body>
</html>
