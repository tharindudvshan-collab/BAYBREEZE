<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090A11">
<meta name="description" content="BAYBREEZE Jaadi Business OS: POS, stock, production, wholesale and profit tracking in real time.">
<title>BAYBREEZE Business OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/core/store.js">
</head>
<body>
<div id="boot" role="status" aria-label="Loading"><div class="ring">B</div></div>

<div id="login" hidden>
 <form id="loginForm" autocomplete="on">
  <div class="brand"><div class="ring">B</div><div><b>BAYBREEZE</b><small>Jaadi Business OS</small></div></div>
  <label class="f">Email<input name="email" type="email" autocomplete="username" required></label>
  <label class="f">Password<input name="password" type="password" autocomplete="current-password" minlength="6" required></label>
  <p class="ferr" id="loginErr" role="alert"></p>
  <button class="cta" type="submit" id="loginGo">Sign in</button>
  <button class="btn" type="button" id="signupGo">Create account</button>
  <p class="note">The first account created becomes the Owner. Later accounts start as Cashier until the Owner changes the role in Staff.</p>
 </form>
</div>

<aside class="side">
 <div class="brand"><div class="ring">B</div><div><b>BAYBREEZE</b><small>Jaadi Business OS</small></div></div>
 <nav id="nav" aria-label="Modules"></nav>
</aside>

<main>
 <header class="top">
  <div class="sw">
   <input class="search" id="gs" type="search" placeholder="Search products, batches, customers…" autocomplete="off" aria-label="Search">
   <div class="sres" id="gsr" hidden></div>
  </div>
  <span class="pill hide-m" id="sync"><span class="dot wait"></span><span>Connecting</span></span>
  <button class="pill hide-m" id="lang" aria-label="Switch language">EN | සිං</button>
  <button class="pill a" id="who">Owner</button>
 </header>
 <div class="demo" id="demo" hidden><span>Demo mode. Sample data is saved only in this browser. Connect Supabase in Settings to save online.</span><button id="clearDemo">Start with empty data</button></div>
 <div class="page" id="page"></div>
</main>
<div class="bnav" id="bnav"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
